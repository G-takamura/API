openapi: 3.0.3
info:
  title: User Management API
  version: 1.0.0
  description: ユーザー情報を管理するためのシンプルなAPI定義
paths:
  /users:
    post:
      summary: 新規ユーザー作成
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 不正なリクエストパラメータ

  /users/{userId}:
    get:
      summary: ユーザー情報取得
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          description: 取得対象のユーザーID
          schema:
            type: integer
            example: 123
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: ユーザーが見つかりません

components:
  schemas:
    UserInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: 山田 太郎
        email:
          type: string
          format: email
          example: taro.yamada@example.com

    User:
      allOf:
        - $ref: '#/components/schemas/UserInput'
        - type: object
          required:
            - id
            - createdAt
          properties:
            id:
              type: integer
              example: 123
            createdAt:
              type: string
              format: date-time
              example: '2026-11-02T15:00:00Z'
